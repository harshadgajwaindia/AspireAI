version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aspireai-redis
    restart: unless-stopped
    ports:
      - "7000:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
